<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Skylink</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      color: var(--text);
      background:
        radial-gradient(circle at top, rgba(224, 48, 48, 0.07), transparent 30rem),
        var(--bg);
    }
    .auth-box {
      width: 100%;
      max-width: 420px;
      padding: 2.5rem;
      border-radius: 1.25rem;
      background: rgba(255, 255, 255, 0.74);
      border-color: rgba(224, 48, 48, 0.18);
    }
    .auth-box h1 { color: var(--text); font-size: 1.75rem; margin-bottom: 0.5rem; }
    .auth-box p.sub { color: var(--muted); margin-bottom: 2rem; font-size: 0.95rem; line-height: 1.45; }
    .auth-tabs { display: flex; gap: 0.5rem; margin-bottom: 2rem; }
    .auth-tab {
      flex: 1;
      padding: 0.7rem;
      border: 1px solid rgba(17, 17, 19, 0.12);
      background: rgba(255, 255, 255, 0.58);
      color: var(--muted);
      border-radius: 0.6rem;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      outline: none;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }
    .auth-tab:hover { border-color: rgba(224, 48, 48, 0.26); color: var(--text); }
    .auth-tab.active { background: var(--red); border-color: var(--red); color: rgb(255, 250, 250); }
    .auth-field { display: flex; flex-direction: column; gap: 0.4rem; margin-bottom: 1.25rem; }
    .auth-field label { color: var(--text); font-size: 0.85rem; font-weight: 700; }
    .auth-field input {
      padding: 0.85rem 1rem;
      border-radius: 0.6rem;
      border: 1px solid rgba(17, 17, 19, 0.1);
      background: rgba(255, 255, 255, 0.68);
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }
    .auth-field input::placeholder { color: rgba(107, 107, 122, 0.68); }
    .auth-field input:focus {
      background: rgba(255, 255, 255, 0.9);
      border-color: var(--red);
      box-shadow: 0 0 0 4px rgba(224, 48, 48, 0.13);
    }
    .auth-btn {
      width: 100%;
      padding: 0.95rem;
      background: var(--red);
      color: rgb(255, 250, 250);
      border: none;
      border-radius: 0.65rem;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      outline: none;
      transition: transform 0.2s, background 0.2s, box-shadow 0.2s;
      margin-top: 0.5rem;
      box-shadow: 0 12px 24px rgba(224, 48, 48, 0.2);
    }
    .auth-btn:hover { background: var(--red-deep); transform: translateY(-1px); }
    .google-btn {
      width: 100%;
      padding: 0.9rem;
      background: rgba(255, 255, 255, 0.86);
      color: var(--text);
      border: 1px solid rgba(17, 17, 19, 0.1);
      border-radius: 0.65rem;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      outline: none;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      margin-top: 0.75rem;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.06);
    }
    .google-btn:hover { border-color: rgba(224, 48, 48, 0.24); transform: translateY(-1px); }
    .auth-tab:focus-visible,
    .auth-btn:focus-visible,
    .google-btn:focus-visible {
      box-shadow: 0 0 0 4px rgba(224, 48, 48, 0.16);
    }
    .google-btn svg { width: 20px; height: 20px; flex-shrink: 0; }
    .divider { display: flex; align-items: center; gap: 0.75rem; margin: 1.25rem 0; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: rgba(17, 17, 19, 0.1); }
    .divider span { font-size: 0.8rem; color: var(--muted); }
    .auth-msg { margin-top: 1rem; font-size: 0.9rem; min-height: 1.2rem; }
    .auth-msg.error { color: var(--red-deep); }
    .auth-msg.success { color: #177245; }
    .brand-link { display: flex; align-items: center; gap: 0.5rem; text-decoration: none; color: var(--text); font-weight: 800; font-size: 1.1rem; margin-bottom: 2.5rem; }
    .brand-link img { height: 56px; }
  </style>
</head>
<body>
  <a class="brand-link" href="index.html">
    <img src="logo.png" alt="Skylink">
    Skylink
  </a>
  <div class="auth-box glass">
    <h1>Welcome back</h1>
    <p class="sub">Sign in to your Skylink account or create a new one.</p>

    <button class="google-btn" id="googleBtn" type="button">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Continue with Google
    </button>

    <div class="divider"><span>or</span></div>

    <div class="auth-tabs">
      <button class="auth-tab active" id="tabLogin" type="button">Login</button>
      <button class="auth-tab" id="tabRegister" type="button">Register</button>
    </div>

    <div id="loginForm">
      <div class="auth-field">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="you@example.com" />
      </div>
      <div class="auth-field">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••" />
      </div>
      <button class="auth-btn" id="loginBtn" type="button">Sign in</button>
    </div>

    <div id="registerForm" style="display:none">
      <div class="auth-field">
        <label>Full name</label>
        <input type="text" id="regName" placeholder="Nguyen Van A" />
      </div>
      <div class="auth-field">
        <label>Email</label>
        <input type="email" id="regEmail" placeholder="you@example.com" />
      </div>
      <div class="auth-field">
        <label>Password</label>
        <input type="password" id="regPassword" placeholder="At least 6 characters" />
      </div>
      <button class="auth-btn" id="registerBtn" type="button">Create account</button>
    </div>

    <p class="auth-msg" id="authMsg"></p>
  </div>

  <script type="module" src="auth.js"></script>
</body>
</html>
